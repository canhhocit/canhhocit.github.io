<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Pham Huu Canh</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafaf9;
        color: #1c1917;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .monogram {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        background: #0f172a;
        color: #ffffff;
        font-weight: 700;
        border-radius: 10px;
        margin-bottom: 24px;
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #0f172a;
      }
      p {
        font-size: 16px;
        color: #57534e;
        max-width: 420px;
        margin: 0 0 24px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 14px;
        transition: background-color 0.2s ease;
      }
      a:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="monogram">HC</div>
    <h1>404 — Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/">Return to Home</a>
  </body>
</html>
